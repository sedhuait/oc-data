name: validate

on:
  pull_request:
    paths: ["products/**", "schemas/**", "scripts/**"]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: "22.x" }

      - name: Tests
        run: npm test

      - name: Canonical format
        run: npm run format:check

      - name: Validate records
        run: npm run validate

      - name: Summarise the change in plain English
        if: github.event_name == 'pull_request'
        run: node src/diff-summary.ts "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Guard the identity fields
        if: github.event_name == 'pull_request'
        run: |
          # changing an existing id, or removing a fact, needs a human. Flag it.
          git diff "${{ github.event.pull_request.base.sha }}" -- products/ \
            | grep -E '^-.*"(id|gtin|ingredients)"' && {
              echo "::warning::This PR changes an id, a GTIN or an ingredient list. Needs maintainer review."
              echo "needs-review=true" >> $GITHUB_OUTPUT
            } || echo "no identity fields removed"
